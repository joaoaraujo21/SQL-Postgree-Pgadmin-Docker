services:
  db:
    container_name: db
    image: postgres:18
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgresql_bin:/usr/lib/postgresql
      - postgresql_data:/var/lib/postgresql
      - ./northwind.sql:/docker-entrypoint-initdb.d/01_northwind.sql
      - ./northwind_index.sql:/docker-entrypoint-initdb.d/02_northwind_index.sql
      - ./northwind_views.sql:/docker-entrypoint-initdb.d/03_northwind_views.sql
      - ./northwind_partition.sql:/docker-entrypoint-initdb.d/04_northwind_partition.sql
      - ./northwind_function.sql:/docker-entrypoint-initdb.d/05_northwind_function.sql
      - ./northwind_procedures.sql:/docker-entrypoint-initdb.d/06_northwind_procedures.sql
      - ./northwind_triggers.sql:/docker-entrypoint-initdb.d/07_northwind_triggers.sql
      - ./northwind_matviews.sql:/docker-entrypoint-initdb.d/08_northwind_matviews.sql
      - ./files:/files
    ports:
      - 55432:5432
    networks:
      - db

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - postgresql_bin:/usr/lib/postgresql
      - pgadmin_root_prefs:/root/.pgadmin
      - pgadmin_working_dir:/var/lib/pgadmin
      - ./files:/files
    ports:
      - 5050:5050
    networks:
      - db

networks:
  db:
    driver: bridge

volumes:
  pgadmin_root_prefs:
    driver: local
  pgadmin_working_dir:
    driver: local
  postgresql_data:
    driver: local
  postgresql_bin:
    driver: local
